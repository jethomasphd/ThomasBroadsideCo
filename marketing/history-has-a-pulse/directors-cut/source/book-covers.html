<!doctype html><html lang="en"><meta charset="utf-8"><title>Literary cover overlays</title><style>
@font-face{font-family:Caslon;src:url(fonts/LibreCaslonDisplay-400.woff2)}@font-face{font-family:Mono;src:url(fonts/IBMPlexMono-400.woff2)}*{box-sizing:border-box}html,body{margin:0;width:600px;height:860px;overflow:hidden}main{position:relative;width:600px;height:860px;color:#e7d6a8;background:linear-gradient(90deg,#0a151b 0%,#1c3440 4%,#0c1f29 6%,#263f4a 9%,#1b303b 90%,#0f242e 100%);box-shadow:inset -4px 0 7px #0008;border:1px solid #b59c6266}.hill{background:linear-gradient(90deg,#210e0d,#442321 4%,#27100f 6%,#582d29 9%,#442220 92%,#291311)}.wood{background:linear-gradient(90deg,#1b2014,#3e442a 4%,#1e2617 6%,#4b5136 9%,#3b412a 92%,#202818)}main:before{content:"";position:absolute;inset:36px 31px 36px 58px;border:1px solid #d5bd7c99;pointer-events:none}main:after{content:"";position:absolute;inset:45px 40px 45px 67px;border:1px solid #d5bd7c44;pointer-events:none}.inside{position:absolute;inset:87px 76px 69px 99px;text-align:center;display:flex;flex-direction:column;align-items:center}.author{font:20px/1.6 Mono;letter-spacing:3px;margin:9px 0 0}.hairline{height:1px;background:#d5bd7c;width:84px;margin:44px auto 36px}h1{font:400 91px/.98 Caslon;margin:0;letter-spacing:1px;text-shadow:0 1px 0 #fff2}.hill h1{font-size:85px}.wood h1{font-size:77px}.part{font:36px/1.2 Caslon;margin:29px 0 0}.edition{margin-top:auto;font:15px/1.65 Mono;letter-spacing:1px;text-transform:uppercase}.year{font:21px Caslon;margin-top:20px}.work{font:19px/1.55 Mono;letter-spacing:1px;text-transform:uppercase;margin-top:35px}.ornament{font:28px Caslon;margin-top:43px;letter-spacing:12px}
</style><main id="cover"><div class="inside" id="inside"></div></main><script>
const id=new URLSearchParams(location.search).get('book')||'sea';
const books={sea:{author:'HOMER',title:'The<br>Odyssey',part:'',work:'',edition:'Translated by<br>Samuel Butler',year:'1900'},hill:{author:'THE HOLY BIBLE',title:'The Gospel<br>according<br>to Matthew',part:'',work:'The Beatitudes<br>Chapter V',edition:'Authorized Version',year:'1611'},wood:{author:'DANTE ALIGHIERI',title:'The Divine<br>Comedy',part:'Inferno',work:'',edition:'Translated by<br>Henry Wadsworth Longfellow',year:'1867'}};
const b=books[id];document.querySelector('#cover').className=id;document.querySelector('#inside').innerHTML=`<p class="author">${b.author}</p><div class="hairline"></div><h1>${b.title}</h1>${b.part?`<p class="part">${b.part}</p>`:''}${b.work?`<p class="work">${b.work}</p>`:''}<div class="ornament">· ◇ ·</div><div class="edition">${b.edition}<div class="year">${b.year}</div></div>`;
</script></html>
