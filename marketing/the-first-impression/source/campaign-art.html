</style><main id="art"></main><script>
const scenes={

franklin:{n:'02',image:'franklin',eyebrow:'Benjamin Franklin / The printer’s eye',title:'He knew what a<br>page could do.',deck:'Long before the Declaration, Franklin made his living in print. He later helped revise its draft.',note:'Source: Library of Congress / Contemporary reconstruction'},
jefferson:{n:'03',image:'jefferson',eyebrow:'Thomas Jefferson / The working draft',title:'The words<br>were worked on.',deck:'Jefferson drafted the text. His colleagues and Congress revised it. The surviving draft keeps the record.',note:'Source: Library of Congress / Contemporary reconstruction'},
dunlap:{n:'04',image:'dunlap',eyebrow:'John Dunlap / July 4–5, 1776',title:'A declaration<br>needed a printer.',deck:'In Dunlap’s Philadelphia shop, the approved words became a broadside. Copies could now leave the room.',note:'Source: Library of Congress / Contemporary reconstruction'},
washington:{n:'05',image:'washington',eyebrow:'George Washington / July 9, 1776',title:'The sheet<br>became a voice.',deck:'Washington had the Declaration read to his troops in New York. One sheet could be heard by many.',note:'Source: Library of Congress / Contemporary reconstruction'},
hamilton:{n:'06',image:'hamilton',eyebrow:'Alexander Hamilton / 1787–1788',title:'The argument<br>kept moving.',deck:'Hamilton, Madison and Jay wrote as Publius. Their Federalist essays carried a later debate into newspapers.',note:'Source: Library of Congress / Contemporary reconstruction'},
austin:{n:'07',image:'austin',eyebrow:'The work continues / Austin, Texas',title:'Different century.<br>Same conviction.',deck:'A working press. Words with a source. A sheet to read again, live with, and pass on.',note:'Our Austin shop / Art-directed photograph'},

};

art.innerHTML=`<img class="picture" src="${src}" alt="${d.eyebrow}">${id==='cover'?'<div class="shade"></div>':''}<header><span>THOMAS BROADSIDE CO.</span><span>${d.n} / 08</span></header><div class="content"><p class="eyebrow">${d.eyebrow}</p><h1>${d.title}</h1><p class="deck">${d.deck}</p>${id==='closing'?'<div class="cta">Explore the collection ↗</div>':''}<p class="note">${d.note}</p></div><footer><span>THE FIRST IMPRESSION</span><span>thomasbroadside.co/origins</span></footer>`;
