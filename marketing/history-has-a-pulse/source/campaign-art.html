<!doctype html><html lang="en"><meta charset="utf-8"><title>History has a pulse — editable campaign artwork</title>
<style>
@font-face{font-family:Caslon;src:url('fonts/LibreCaslonDisplay-400.woff2')}@font-face{font-family:Text;src:url('fonts/LibreCaslonText-400.woff2')}@font-face{font-family:Mono;src:url('fonts/IBMPlexMono-400.woff2')}
*{box-sizing:border-box}body{margin:0}.art{position:relative;width:100vw;height:100vh;overflow:hidden;background:#f1ece0;color:#201a10}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:65% center}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#17130fee,#17130f11),linear-gradient(0deg,#17130fed,transparent 65%)}.brand{font:20px Mono;letter-spacing:.15em;text-transform:uppercase}.brand b{color:#9e3123;margin-right:14px}.content{position:absolute;inset:7.2%;display:flex;flex-direction:column}.kicker{font:16px Mono;letter-spacing:.2em;text-transform:uppercase}.headline{font:150px/.94 Caslon;letter-spacing:-.025em;margin:76px 0 28px}.headline em{font-style:normal;color:#e4cfad}.intro{font:24px/1.6 Text;max-width:530px}.bottom{margin-top:auto;border-top:1px solid #ffffff66;padding-top:24px;display:flex;justify-content:space-between;align-items:end;gap:30px;font:17px/1.6 Mono}.pulse{color:#faf6ea}.pulse .brand b{color:#d7b78f}.pulse .kicker{margin-top:12px;color:#d3c5b0}.pulse .brand{font-size:18px}.pulse .headline{max-width:600px}.pulse .bottom{color:#e5d8c3}
.product .content{inset:6.8%}.product .brand{font-size:17px}.product .headline{font-size:98px;margin:55px 0 20px;max-width:590px}.product .kicker{color:#9e3123}.product .intro{font-size:22px;max-width:530px}.product .sheet{position:absolute;width:42%;right:7%;top:21%;height:64%;object-fit:contain;filter:drop-shadow(0 15px 20px #201a1022)}.product .bottom{border-color:#201a1055;font-size:15px}.product .copy{max-width:48%}.product .cta{display:inline-block;border-bottom:1px solid #9e3123;padding:14px 0;color:#9e3123;font:18px Mono}

.landscape .headline{font-size:116px;margin:50px 0 20px}.landscape .intro{font-size:21px;max-width:590px}.landscape .brand{font-size:16px}.landscape .bottom{font-size:13px;padding-top:16px}.landscape.product .headline{font-size:88px;margin-top:42px}.landscape.product .sheet{height:75%;top:13%;width:29%;right:8%}.landscape.product .intro{font-size:20px}.landscape.product .copy{max-width:58%}.landscape.product .cta{font-size:15px}.landscape .content{inset:8% 6%}
.overlay{background:transparent;color:#faf6ea}.overlay .content{inset:6.5%}.overlay .brand{font-size:18px}.overlay .captionbox{margin-top:auto;padding:32px 40px;background:#17130fdb;border-left:5px solid #c8aa7e;width:fit-content;max-width:90%}.overlay .headline{font-size:73px;margin:0 0 12px}.overlay .kicker{font-size:18px;margin:0}.overlay.vertical .content{inset:13% 8% 19%}.overlay.vertical .headline{font-size:94px}.overlay.vertical .captionbox{padding:32px;max-width:100%}.overlay.vertical .kicker{font-size:21px}.overlay.square .headline{font-size:80px}.overlay.square .content{inset:8%}.endcard .headline{font-size:100px}.endcard .sheet{height:68%;top:18%}.endcard .bottom{font-size:21px}
</style><main class="art" id="art"></main>
<script>
const p=new URLSearchParams(location.search), mode=p.get('mode')||'pulse',format=p.get('format')||'portrait',title=p.get('title'),sub=p.get('sub');
const box=document.getElementById('art');box.className=`art ${mode} ${format}`;
const brand='<div class="brand"><b>★</b>Thomas Broadside Co.</div>';
if(mode==='overlay')box.innerHTML=`<div class="content">${brand}<div class="captionbox"><h1 class="headline"></h1><p class="kicker"></p></div></div>`;
else if(mode==='pulse')box.innerHTML=`<img class="photo" src="../artwork/press-portrait-enhanced.png" alt=""><div class="shade"></div><div class="content">${brand}<div class="kicker">Austin, Texas / A working print shop</div><h1 class="headline">History has<br>a <em>pulse.</em></h1><p class="intro">Founding documents.<br>A family press.<br>Something worth keeping.</p><div class="bottom"><span>PRINTED HERE.<br>MADE TO BE KEPT.</span><span>thomasbroadside.co ↗</span></div></div>`;
else box.innerHTML=`<img class="sheet" src="catalog-art/declaration-of-independence.jpg" alt="Declaration of Independence broadside"><div class="content">${brand}<div class="copy"><h1 class="headline">Give history<br>a place<br>on your wall.</h1><p class="kicker">The Declaration of Independence</p><p class="intro">Set in Caslon. Printed in Austin.<br>Discover the numbered edition<br>and the founding documents collection.</p><div class="cta">Find your broadside ↗</div></div><div class="bottom"><span>BUILD SOMETHING THAT LASTS</span><span>thomasbroadside.co</span></div></div>`;
if(title)box.querySelector('.headline').textContent=title;if(sub)box.querySelector('.kicker').textContent=sub;
</script></html>
